<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM - window</title>
    <style>
      body {
        height: 3000px;
      }
    </style>
    <script>
      document.write('innerWidth : ' + window.innerWidth + '<br>');
      window.open('http://youtube.com', '', 'width=300,height=300', true);
      var newWindow = window.open('', '', 'width=300,height=300');
      setTimeout(function () {
        newWindow.close();
      }, 3000);

      var num = 5;
      setInterval(function(){
        document.write('<h1>' + num + '</h1>');

        num --;
      },1000)

      setTimeout(function(){
        window.self.close();
      }, 5001);
    </script>
  </head>
  <body></body>
</html>
